version: "3.9"

networks:
  fyp-net:

volumes:
  mongo-data:
  prometheus-data:
  grafana-data:

services:

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - fyp-net

  frontend:
    image: muzaffaribrar/fyp-frontend:latest
    container_name: frontend
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - fyp-net

  backend:
    image: muzaffaribrar/fyp-backend:latest
    container_name: backend
    expose:
      - "8000"
    depends_on:
      - mongo
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - fyp-net

  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - fyp-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - fyp-net
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    networks:
      - fyp-net
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    networks:
      - fyp-net
    volumes:
      - /home/ubuntu/FYP/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    depends_on:
      - node-exporter
      - cadvisor
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - fyp-net
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
