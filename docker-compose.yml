version: '3.9'
services:

  frontend:
    image: muzaffaribrar/fyp-frontend:latest
    ports:
      - "5173:80"
    depends_on:
      - backend
    # env_file:
    #   - ./frontend/.env
    restart: unless-stopped

  backend:
    image: muzaffaribrar/fyp-backend:latest
    ports:
      - "8000:8000"
      # - "3000:3000"  # Socket.IO port
    depends_on:
      - mongo
    env_file:
      - ./backend/.env
    restart: unless-stopped

  # socketio:
  #   build: ./backend             # Assuming socketServer.js is in backend folder
  #   command: node socketServer.js
  #   ports:
  #     - "3000:3000"             # Host:Container
  #   env_file:
  #     - ./backend/.env
  #   depends_on:
  #     - backend
  #   restart: unless-stopped

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data: