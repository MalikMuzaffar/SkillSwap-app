name: CI/CD for FYP

on:
  push:
    branches:
      - main

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Clear Vite cache
        working-directory: ./frontend
        run: |
          rm -rf node_modules/.vite
          rm -rf dist

      - name: Build frontend Docker image
        run: |
          docker build --no-cache \
            --build-arg VITE_BACKEND_URI="http://${{ secrets.EC2_IP }}" \
            --build-arg VITE_SOCKET_URI="http://${{ secrets.EC2_IP }}" \
            -t muzaffaribrar/fyp-frontend:$BUILD_NUMBER \
            -t muzaffaribrar/fyp-frontend:latest \
            ./frontend

      - name: Push frontend image
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push muzaffaribrar/fyp-frontend:$BUILD_NUMBER
          docker push muzaffaribrar/fyp-frontend:latest

      - name: Build backend Docker image
        run: |
          docker build \
            -t muzaffaribrar/fyp-backend:$BUILD_NUMBER \
            -t muzaffaribrar/fyp-backend:latest \
            ./backend

      - name: Push backend image
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push muzaffaribrar/fyp-backend:$BUILD_NUMBER
          docker push muzaffaribrar/fyp-backend:latest

      - name: Deploy to EC2
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          CLOUDINARY_NAME: ${{ secrets.CLOUDINARY_NAME }}
          CLOUDINARY_KEY: ${{ secrets.CLOUDINARY_KEY }}
          CLOUDINARY_SECRET: ${{ secrets.CLOUDINARY_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EC2_IP: ${{ secrets.EC2_IP }}

        run: |
          echo "${{ secrets.KEY_PEM }}" > key.pem
          chmod 600 key.pem

          # Copy docker compose + monitoring + nginx
          scp -o StrictHostKeyChecking=no -i key.pem ./docker-compose.yml ubuntu@$EC2_IP:/home/ubuntu/FYP/docker-compose.yml
          #scp -o StrictHostKeyChecking=no -i key.pem -r ./monitoring ubuntu@$EC2_IP:/home/ubuntu/FYP/
          #scp -o StrictHostKeyChecking=no -i key.pem -r ./nginx ubuntu@$EC2_IP:/home/ubuntu/FYP/

          # Create backend .env on EC2
          ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@$EC2_IP << EOF
          mkdir -p /home/ubuntu/FYP/backend

          cat > /home/ubuntu/FYP/backend/.env << EOT
          PORT=8000
          MONGO_URI=$MONGO_URI
          ACCESS_TOKEN=$ACCESS_TOKEN
          REFRESH_TOKEN=$REFRESH_TOKEN
          CLOUDINARY_NAME=$CLOUDINARY_NAME
          CLOUDINARY_KEY=$CLOUDINARY_KEY
          CLOUDINARY_SECRET=$CLOUDINARY_SECRET
          SMTP_USER=$SMTP_USER
          SMTP_PASS=$SMTP_PASS
          FRONTEND_URL=http://$EC2_IP
          EOT
          EOF

          # Deploy
          ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@$EC2_IP << EOF
          cd /home/ubuntu/FYP
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          docker-compose pull
          docker-compose down
          docker-compose up -d
          EOF
